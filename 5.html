<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ohhapple • docs</title>
    <link rel="icon" type="image/x-icon" href="images/icon/ohhapple.ico">
    <link rel="manifest" href="images/icon/site.webmanifest">
    <!-- 禁止识别电话/邮箱，避免长按弹出菜单 -->
    <meta name="format-detection" content="telephone=no, email=no">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0a1c2c;
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            overflow: hidden;
            cursor: url('images/mouse/normal.cur') 4 4, auto;
            input, textarea, [contenteditable="true"] {
                cursor: url('images/mouse/handwriting.cur') 4 8, text;
            }
            a, button, [role="button"] {
                cursor: url('images/mouse/normal.cur') 8 4, pointer;
            }
        }

        /* ----- 彻底禁止选中/长按菜单（移动端+桌面）----- */
        html, body {
            -webkit-user-select: none;      /* Chrome, Safari, Opera */
            -moz-user-select: none;         /* Firefox */
            -ms-user-select: none;          /* Internet Explorer/Edge */
            user-select: none;              /* 标准语法 */
            -webkit-touch-callout: none;    /* 禁止长按弹出菜单（iOS） */
        }

        .parallax-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #0a1c2c;
        }

        .layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            will-change: transform;
            backdrop-filter: blur(0px);   /* 强制独立合成层，确保永不合并 */
            pointer-events: none;
        }

        .layer-video {
            object-fit: cover;
            width: 110% !important;
            height: 110% !important;
            left: -5% !important;
            top: -5% !important;
            pointer-events: none;
            /* 以下属性针对移动端防止视频被提取/下载 */
            -webkit-touch-callout: none;
            -webkit-user-select: none;
        }

        .main-title {
            text-shadow: 0 0 30px #7fd9ff, 0 0 60px #3f7e9a;
            font-size: clamp(4rem, 14vw, 9rem);
            font-weight: 900;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            text-align: center;
            line-height: 1.2;
            filter: drop-shadow(0 8px 12px black);
            background: linear-gradient(135deg, #ffffff, #b0e0ff, #80c0ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            white-space: nowrap;
        }
        .sub-title {
            color: #dff5ff;
            font-size: 1.6rem;
            letter-spacing: 0.5em;
            margin-top: 1.5rem;
            text-shadow: 0 4px 15px #0099cc;
            background: transparent;
            padding: 0.6rem 2.5rem;
            font-weight: 300;
            display: inline-block;
        }

        /* ----- 音乐控制按钮样式 ----- */
        .music-control {
            position: fixed;
            bottom: 25px;
            right: 25px;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: rgba(10, 30, 50, 0.75);
            backdrop-filter: blur(6px);
            border: 2px solid rgba(255, 255, 255, 0.25);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
            color: white;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 10000;
            transition: all 0.3s ease;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            outline: none;
            padding: 0;
            line-height: 1;
        }

        .music-control:hover {
            background: rgba(20, 60, 90, 0.9);
            border-color: #7fd9ff;
            transform: scale(1.1);
            box-shadow: 0 0 25px #7fd9ff;
        }

        .music-control:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>
<div class="parallax-container" id="parallaxContainer">
    <!-- 视频元素：不直接写 src，通过 JS 动态加载 blob URL 防止嗅探 -->
    <video class="layer layer-video" id="layerVideo" data-speed="0.06" muted loop playsinline preload="none"
           oncontextmenu="return false;"
           style="pointer-events: none;">
        <!-- 移除了 source 标签，由 JS 动态设置 src -->
        您的浏览器不支持 video 标签。
    </video>

    <div class="layer layer-mid2" id="layerMid2" data-speed="0.08">
        <div style="text-align: center; padding-top: 5vh;">
            <div class="main-title">
                <a href="document/document.html"
                   style="text-decoration: none; color: inherit; pointer-events: auto; display: inline-block;">
                    银凇止境
                </a>
            </div>
            <div class="sub-title">Document Entry</div>
        </div>
    </div>
</div>

<!-- 背景音乐 -->
<audio id="bgMusic" loop preload="auto">
    <source src="images/audio/bgwm.mp3" type="audio/mpeg" />
    您的浏览器不支持 audio 元素。
</audio>

<!-- 音乐控制按钮 -->
<button class="music-control" id="musicControl" aria-label="音乐播放控制">🔇</button>

<!-- 视差脚本 -->
<script>
    (function() {
        const container = document.getElementById('parallaxContainer');
        const layers = document.querySelectorAll('.layer');
        if (!container || layers.length === 0) return;

        const layerStates = [];
        layers.forEach(layer => {
            layerStates.push({
                element: layer,
                currentX: 0,
                currentY: 0,
                targetX: 0,
                targetY: 0,
                speed: parseFloat(layer.getAttribute('data-speed')) || 0.1
            });
        });

        let centerX = window.innerWidth / 2;
        let centerY = window.innerHeight / 2;
        const maxOffset = 800;
        const lerpFactor = 0.03;

        function updateCenter() {
            centerX = window.innerWidth / 2;
            centerY = window.innerHeight / 2;
        }
        window.addEventListener('resize', updateCenter);

        function handleMouseMove(event) {
            const mouseX = event.clientX;
            const mouseY = event.clientY;

            let offsetX = (mouseX - centerX) / centerX;
            let offsetY = (mouseY - centerY) / centerY;

            offsetX = Math.min(1, Math.max(-1, offsetX));
            offsetY = Math.min(1, Math.max(-1, offsetY));

            layerStates.forEach(state => {
                state.targetX = -offsetX * state.speed * maxOffset;
                state.targetY = -offsetY * state.speed * maxOffset;
            });
        }

        function handleMouseLeave() {
            layerStates.forEach(state => {
                state.targetX = 0;
                state.targetY = 0;
            });
        }

        function animateLayers() {
            layerStates.forEach(state => {
                const newX = state.currentX + (state.targetX - state.currentX) * lerpFactor;
                const newY = state.currentY + (state.targetY - state.currentY) * lerpFactor;

                state.currentX = newX;
                state.currentY = newY;

                state.element.style.transform = `translate(${newX.toFixed(1)}px, ${newY.toFixed(1)}px)`;
            });

            requestAnimationFrame(animateLayers);
        }

        container.addEventListener('mousemove', handleMouseMove);
        container.addEventListener('mouseleave', handleMouseLeave);

        animateLayers();
    })();
</script>

<!-- 鼠标控制视频播放/暂停 -->
<script>
    (function() {
        const video = document.getElementById('layerVideo');
        if (!video) return;

        // 初始暂停（src 尚未设置，但调用 pause 无害）
        video.pause();

        const container = document.getElementById('parallaxContainer');
        if (!container) return;

        let idleTimer = null;
        const idleDelay = 300;

        function playVideo() {
            if (video.paused) {
                video.play().catch(err => console.log('视频播放需用户交互或尚未加载:', err));
            }
        }

        function pauseVideo() {
            if (!video.paused) {
                video.pause();
            }
        }

        function onMouseMove() {
            if (idleTimer) {
                clearTimeout(idleTimer);
                idleTimer = null;
            }
            playVideo();
            idleTimer = setTimeout(pauseVideo, idleDelay);
        }

        function onMouseLeave() {
            if (idleTimer) {
                clearTimeout(idleTimer);
                idleTimer = null;
            }
            pauseVideo();
        }

        container.addEventListener('mousemove', onMouseMove);
        container.addEventListener('mouseleave', onMouseLeave);
    })();
</script>

<!-- 音乐播放控制独立逻辑 -->
<script>
    (function() {
        const audio = document.getElementById('bgMusic');
        const controlBtn = document.getElementById('musicControl');

        if (!audio || !controlBtn) return;

        controlBtn.textContent = '🔇';

        controlBtn.addEventListener('click', function() {
            if (audio.paused) {
                audio.play()
                    .then(() => {
                        controlBtn.textContent = '🔊';
                    })
                    .catch(err => {
                        console.warn('音频播放失败，请检查音乐文件路径或格式：', err);
                        controlBtn.textContent = '🔇';
                    });
            } else {
                audio.pause();
                controlBtn.textContent = '🔇';
            }
        });

        audio.addEventListener('pause', function() {
            controlBtn.textContent = '🔇';
        });
        audio.addEventListener('play', function() {
            controlBtn.textContent = '🔊';
        });

        audio.addEventListener('error', function() {
            console.error('音频加载失败');
        });
    })();
</script>

<!-- 阻止 Ctrl+A / Cmd+A 全选 -->
<script>
    (function() {
        document.addEventListener('keydown', function(e) {
            if ((e.ctrlKey || e.metaKey) && (e.key === 'a' || e.key === 'A')) {
                e.preventDefault();
                return false;
            }
        });
    })();
</script>

<!-- 全局阻止右键/长按菜单 -->
<script>
    (function() {
        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
            return false;
        });
    })();
</script>

<!-- 动态添加防下载属性（避免HTML验证警告） -->
<script>
    (function() {
        const video = document.getElementById('layerVideo');
        if (video) {
            // 标准防下载属性
            video.setAttribute('controlsList', 'nodownload');
            video.setAttribute('disablePictureInPicture', '');
            // 非标准但有助于防止下载/播放器干预的属性
            video.setAttribute('x-webkit-airplay', 'deny');          // 禁用 AirPlay
            video.setAttribute('x5-video-player-type', 'h5');        // 强制腾讯X5使用H5播放器
            // 可选的额外属性：禁止远程播放
            video.setAttribute('disableremoteplayback', '');         // 部分浏览器支持
        }
    })();
</script>

<!-- ========= 防视频嗅探：fetch + blob 加载 ========= -->
<script>
    (function() {
        const video = document.getElementById('layerVideo');
        if (!video) return;

        const videoUrl = 'images/video/bg3.mp4';  // 视频真实路径

        // 使用 fetch 获取视频数据并转为 blob URL
        fetch(videoUrl)
            .then(response => {
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                return response.blob();
            })
            .then(blob => {
                const blobUrl = URL.createObjectURL(blob);
                video.src = blobUrl;
                video.load();  // 加载元数据
                console.log('视频已通过 blob 加载，防嗅探生效');
            })
            .catch(err => {
                console.warn('blob 加载失败，使用直连降级', err);
                // 降级方案：直接设置 src（可能被嗅探，但至少能播放）
                video.src = videoUrl;
            });
    })();
</script>

</body>
</html>
