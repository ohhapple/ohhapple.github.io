<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ohhapple • docs</title>
    <link rel="icon" type="image/x-icon" href="images/icon/ohhapple.ico">
    <link rel="manifest" href="images/icon/site.webmanifest">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0a1c2c;
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            overflow: hidden;
            cursor: url('images/mouse/normal.cur') 4 4, auto;
            input, textarea, [contenteditable="true"] {
                cursor: url('images/mouse/handwriting.cur') 4 8, text;
            }
            a, button, [role="button"] {
                cursor: url('images/mouse/normal.cur') 8 4, pointer;
            }
        }

        /* ----- 禁止用户选中任何内容 ----- */
        html, body {
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        .parallax-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #0a1c2c;
        }

        .layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            will-change: transform;
            backdrop-filter: blur(0px);   /* 强制独立合成层 */
            pointer-events: none;
        }

        .layer-video {
            object-fit: cover;
            width: 110% !important;
            height: 110% !important;
            left: -5% !important;
            top: -5% !important;
            pointer-events: none;
        }

        .main-title {
            text-shadow: 0 0 30px #7fd9ff, 0 0 60px #3f7e9a;
            font-size: clamp(4rem, 14vw, 9rem);
            font-weight: 900;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            text-align: center;
            line-height: 1.2;
            filter: drop-shadow(0 8px 12px black);
            background: linear-gradient(135deg, #ffffff, #b0e0ff, #80c0ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            white-space: nowrap;
        }
        .sub-title {
            color: #dff5ff;
            font-size: 1.6rem;
            letter-spacing: 0.5em;
            margin-top: 1.5rem;
            text-shadow: 0 4px 15px #0099cc;
            background: transparent;
            padding: 0.6rem 2.5rem;
            font-weight: 300;
            display: inline-block;
        }

        /* ----- 通用按钮样式（全屏、音乐、跳转）----- */
        .music-control {
            position: fixed;
            bottom: 25px;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: rgba(10, 30, 50, 0.75);
            backdrop-filter: blur(6px);
            border: 2px solid rgba(255, 255, 255, 0.25);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
            color: white;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: url('images/mouse/normal.cur') 8 4, pointer;
            z-index: 10000;
            transition: all 0.3s ease;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            outline: none;
            padding: 0;
            line-height: 1;
            text-decoration: none;
            /* 默认透明度 0.5 */
            opacity: 0.5;
        }

        .music-control:hover {
            background: rgba(20, 60, 90, 0.9);
            border-color: #7fd9ff;
            transform: scale(1.1);
            box-shadow: 0 0 25px #7fd9ff;
            opacity: 1; /* 悬停时不透明，突出交互 */
        }

        .music-control:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>
<div class="parallax-container" id="parallaxContainer">
    <video class="layer layer-video" id="layerVideo" data-speed="0.06" muted loop playsinline preload="auto">
        <source src="images/video/bg30.mp4" type="video/mp4">
        您的浏览器不支持 video 标签。
    </video>

    <div class="layer layer-mid2" id="layerMid2" data-speed="0.08">
        <div style="text-align: center; padding-top: 5vh;">
            <div class="main-title">
                <a href="simple.html"
                   style="text-decoration: none; color: inherit; pointer-events: auto; display: inline-block;">
<!--                    银凇止境-->
                    进入主页
                </a>
            </div>
            <div class="sub-title">Document Entry</div>
        </div>
    </div>

    <!-- 右下角按钮组：全屏 + 音乐 + 跳转 (并排) -->
    <button class="music-control" id="fullscreenControl" style="right: 25px;" aria-label="全屏模式">⛶</button>
    <button class="music-control" id="musicControl" style="right: 69px;" aria-label="音乐播放控制">🔇</button>
    <a class="music-control" href="simple.html" rel="noopener" style="right: 113px; text-decoration: none;" aria-label="跳转到其他页面">🔗</a>

</div>

<!-- ===== 背景音乐 ===== -->
<audio id="bgMusic" loop preload="auto">
    <source src="images/audio/bgwm.mp3" type="audio/mpeg">
    您的浏览器不支持 audio 元素。
</audio>

<!-- 视差脚本 -->
<script>
    (function() {
        const container = document.getElementById('parallaxContainer');
        const layers = document.querySelectorAll('.layer');
        if (!container || layers.length === 0) return;

        const layerStates = [];
        layers.forEach(layer => {
            layerStates.push({
                element: layer,
                currentX: 0,
                currentY: 0,
                targetX: 0,
                targetY: 0,
                speed: parseFloat(layer.getAttribute('data-speed')) || 0.1
            });
        });

        let centerX = window.innerWidth / 2;
        let centerY = window.innerHeight / 2;
        const maxOffset = 800;
        const lerpFactor = 0.03;

        function updateCenter() {
            centerX = window.innerWidth / 2;
            centerY = window.innerHeight / 2;
        }
        window.addEventListener('resize', updateCenter);

        function handleMouseMove(event) {
            const mouseX = event.clientX;
            const mouseY = event.clientY;

            let offsetX = (mouseX - centerX) / centerX;
            let offsetY = (mouseY - centerY) / centerY;

            offsetX = Math.min(1, Math.max(-1, offsetX));
            offsetY = Math.min(1, Math.max(-1, offsetY));

            layerStates.forEach(state => {
                state.targetX = -offsetX * state.speed * maxOffset;
                state.targetY = -offsetY * state.speed * maxOffset;
            });
        }

        function animateLayers() {
            layerStates.forEach(state => {
                const newX = state.currentX + (state.targetX - state.currentX) * lerpFactor;
                const newY = state.currentY + (state.targetY - state.currentY) * lerpFactor;

                state.currentX = newX;
                state.currentY = newY;

                state.element.style.transform = `translate(${newX.toFixed(1)}px, ${newY.toFixed(1)}px)`;
            });

            requestAnimationFrame(animateLayers);
        }

        container.addEventListener('mousemove', handleMouseMove);

        animateLayers();
    })();
</script>

<!-- 鼠标控制视频播放/暂停 -->
<script>
    (function() {
        const video = document.getElementById('layerVideo');
        if (!video) return;

        video.pause();

        const container = document.getElementById('parallaxContainer');
        if (!container) return;

        let idleTimer = null;
        const idleDelay = 300;

        function playVideo() {
            if (video.paused) {
                video.play().catch(err => console.log('视频播放需用户交互:', err));
            }
        }

        function pauseVideo() {
            if (!video.paused) {
                video.pause();
            }
        }

        function onMouseMove() {
            if (idleTimer) {
                clearTimeout(idleTimer);
                idleTimer = null;
            }
            playVideo();
            idleTimer = setTimeout(pauseVideo, idleDelay);
        }

        function onMouseLeave() {
            if (idleTimer) {
                clearTimeout(idleTimer);
                idleTimer = null;
            }
            pauseVideo();
        }

        container.addEventListener('mousemove', onMouseMove);
        container.addEventListener('mouseleave', onMouseLeave);
    })();
</script>

<!-- 音乐播放控制逻辑 -->
<script>
    (function() {
        const audio = document.getElementById('bgMusic');
        const controlBtn = document.getElementById('musicControl');

        if (!audio || !controlBtn) return;

        controlBtn.textContent = '🔇';

        controlBtn.addEventListener('click', function() {
            if (audio.paused) {
                audio.play()
                    .then(() => {
                        controlBtn.textContent = '🔊';
                    })
                    .catch(err => {
                        console.warn('音频播放失败:', err);
                        controlBtn.textContent = '🔇';
                    });
            } else {
                audio.pause();
                controlBtn.textContent = '🔇';
            }
        });

        audio.addEventListener('pause', function() {
            controlBtn.textContent = '🔇';
        });
        audio.addEventListener('play', function() {
            controlBtn.textContent = '🔊';
        });

        audio.addEventListener('error', function() {
            console.error('音频加载失败');
        });
    })();
</script>

<!-- 全屏控制脚本 (手动切换 + ESC同步) -->
<script>
    (function() {
        const fullscreenBtn = document.getElementById('fullscreenControl');
        if (!fullscreenBtn) return;

        // 进入全屏
        function requestFullscreen() {
            const docElm = document.documentElement;
            if (docElm.requestFullscreen) {
                return docElm.requestFullscreen();
            } else if (docElm.mozRequestFullScreen) {
                return docElm.mozRequestFullScreen();
            } else if (docElm.webkitRequestFullscreen) {
                return docElm.webkitRequestFullscreen();
            } else if (docElm.msRequestFullscreen) {
                return docElm.msRequestFullscreen();
            }
            return Promise.reject('Fullscreen API not supported');
        }

        // 退出全屏
        function exitFullscreen() {
            if (document.exitFullscreen) {
                document.exitFullscreen();
            } else if (document.mozCancelFullScreen) {
                document.mozCancelFullScreen();
            } else if (document.webkitExitFullscreen) {
                document.webkitExitFullscreen();
            } else if (document.msExitFullscreen) {
                document.msExitFullscreen();
            }
        }

        // 切换全屏
        function toggleFullscreen() {
            if (!document.fullscreenElement && !document.mozFullScreenElement &&
                !document.webkitFullscreenElement && !document.msFullscreenElement) {
                requestFullscreen().catch(err => {
                    console.warn('全屏请求失败:', err);
                });
            } else {
                exitFullscreen();
            }
        }

        // 更新按钮图标
        function updateIcon() {
            if (document.fullscreenElement || document.mozFullScreenElement ||
                document.webkitFullscreenElement || document.msFullscreenElement) {
                fullscreenBtn.textContent = '✕';
            } else {
                fullscreenBtn.textContent = '⛶';
            }
        }

        // 监听全屏变化（ESC 或 API 退出）
        document.addEventListener('fullscreenchange', updateIcon);
        document.addEventListener('webkitfullscreenchange', updateIcon);
        document.addEventListener('mozfullscreenchange', updateIcon);
        document.addEventListener('MSFullscreenChange', updateIcon);

        // 按钮点击切换
        fullscreenBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            toggleFullscreen();
        });

        // 初始化图标
        updateIcon();
    })();
</script>

<!-- 阻止右键菜单 -->
<script>
    (function() {
        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
            return false;
        });
    })();
</script>

<!-- 阻止 Ctrl+A / Cmd+A 全选 -->
<script>
    (function() {
        document.addEventListener('keydown', function(e) {
            if ((e.ctrlKey || e.metaKey) && (e.key === 'a' || e.key === 'A')) {
                e.preventDefault();
                return false;
            }
        });
    })();
</script>
