<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ohhapple•docs · 项目仓库</title>
    <link rel="icon" type="image/x-icon" href="../images/icon/ohhapple.ico">
    <link rel="manifest" href="../images/icon/site.webmanifest">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
<script src="../js/script.js"></script>
<script>
    renderCommonLayout('repos', '../');

    // 本页独有翻译
    const pageI18n = {
        zh: {
            'repos.title': '📦 项目仓库',
            'repos.searchPlaceholder': '搜索仓库...',
            'repos.card.carpetplus.desc': 'Minecraft Carpet 扩展模组，提供更多游戏特性控制与优化。',
            'repos.card.lwjglwindows.desc': 'LWJGL 窗口封装库，旨在解决Minecraft不同版本间GUI代码差异问题。',
            'repos.footer': '点击卡片可直接跳转到 GitHub 仓库。',
            'docs.carpetplus.title': 'CarpetPlus',
            'docs.lwjglwindows.title': 'LWJGLwindows',
            'common.repository': '仓库',
            'common.view': '访问',
            'common.doc': '文档'
        },
        en: {
            'repos.title': '📦 Repositories',
            'repos.searchPlaceholder': 'Search repositories...',
            'repos.card.carpetplus.desc': 'Minecraft Carpet extension mod, providing more game feature control and optimization.',
            'repos.card.lwjglwindows.desc': 'LWJGL window wrapper library to solve GUI code differences across Minecraft versions.',
            'repos.footer': 'Click card to jump directly to GitHub repository.',
            'docs.carpetplus.title': 'CarpetPlus',
            'docs.lwjglwindows.title': 'LWJGLwindows',
            'common.repository': 'Repository',
            'common.view': 'View',
            'common.doc': 'Docs'
        }
    };

    Object.assign(window.i18n.zh, pageI18n.zh);
    Object.assign(window.i18n.en, pageI18n.en);

    document.addEventListener('DOMContentLoaded', function() {
        const content = document.getElementById('page-content');
        if (!content) return;

        content.innerHTML = `
                <div class="section-title" style="margin-top:2rem;">
                    <h2 data-i18n="repos.title">📦 项目仓库</h2>
                    <a href="document.html"><span data-i18n="common.doc">文档</span> <i class="fas fa-chevron-right"></i></a>
                </div>

                <div class="search-wrapper">
                    <div class="search-box">
                        <i class="fas fa-search"></i>
                        <input type="text" id="searchInput" placeholder="" data-i18n-placeholder="repos.searchPlaceholder" autocomplete="off">
                    </div>
                </div>

                <div class="docs-grid" id="docsGrid">
                    <a href="https://github.com/ohhapple/CarpetPlus" target="_blank" style="text-decoration: none;" class="doc-card-link">
                        <article class="doc-card">
                            <div class="card-icon"><i class="fab fa-github"></i></div>
                            <h3 data-i18n="docs.carpetplus.title">CarpetPlus</h3>
                            <p data-i18n="repos.card.carpetplus.desc">Minecraft Carpet 扩展模组，提供更多游戏特性控制与优化。</p>
                            <div class="card-meta">
                                <span class="tag"><i class="fas fa-code"></i> <span data-i18n="common.repository">仓库</span></span>
                                <span class="doc-link"><span data-i18n="common.view">访问</span> <i class="fas fa-arrow-right"></i></span>
                            </div>
                        </article>
                    </a>
                    <a href="https://github.com/ohhapple/LWJGLwindows" target="_blank" style="text-decoration: none;" class="doc-card-link">
                        <article class="doc-card">
                            <div class="card-icon"><i class="fab fa-github"></i></div>
                            <h3 data-i18n="docs.lwjglwindows.title">LWJGLwindows</h3>
                            <p data-i18n="repos.card.lwjglwindows.desc">LWJGL 窗口封装库，旨在解决Minecraft不同版本间GUI代码差异问题。</p>
                            <div class="card-meta">
                                <span class="tag"><i class="fas fa-code"></i> <span data-i18n="common.repository">仓库</span></span>
                                <span class="doc-link"><span data-i18n="common.view">访问</span> <i class="fas fa-arrow-right"></i></span>
                            </div>
                        </article>
                    </a>
                </div>

                <div style="margin: 3rem 0; text-align: center; opacity: 0.7;">
                    <p data-i18n="repos.footer">点击卡片可直接跳转到 GitHub 仓库。</p>
                </div>
            `;

        window.applyLanguage(localStorage.getItem('siteLanguage') || 'zh');
    });
</script>
</body>
</html>
