<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ohhapple•docs · 文档索引</title>
    <link rel="icon" type="image/x-icon" href="../images/icon/ohhapple.ico">
    <link rel="manifest" href="../images/icon/site.webmanifest">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
<script src="../js/script.js"></script>
<script>
    renderCommonLayout('docs', '../');

    const pageI18n = {
        zh: {
            'docs.pageTitle': '📚 项目文档',
            'docs.searchPlaceholder': '搜索文档...',
            'docs.search.foot': '选择上面的项目查看详细文档。',
            'docs.carpetplus.title': 'CarpetPlus',
            'docs.carpetplus.desc': 'Minecraft Carpet 扩展模组，提供更多游戏特性控制与优化。',
            'docs.lwjglwindows.title': 'LWJGLwindows',
            'docs.lwjglwindows.desc': 'LWJGL 窗口封装库，旨在解决Minecraft不同版本间GUI代码差异问题。',
            'common.doc': '文档',
            'common.read': '阅读',
            'common.repository': '仓库'
        },
        en: {
            'docs.pageTitle': '📚 Project Docs',
            'docs.searchPlaceholder': 'Search docs...',
            'docs.search.foot': 'Select the item above to view detailed documentation.',
            'docs.carpetplus.title': 'CarpetPlus',
            'docs.carpetplus.desc': 'Minecraft Carpet extension mod, providing more game feature control and optimization.',
            'docs.lwjglwindows.title': 'LWJGLwindows',
            'docs.lwjglwindows.desc': 'LWJGL window wrapper library to solve GUI code differences across Minecraft versions.',
            'common.doc': 'Docs',
            'common.read': 'Read',
            'common.repository': 'Repository'
        }
    };

    Object.assign(window.i18n.zh, pageI18n.zh);
    Object.assign(window.i18n.en, pageI18n.en);

    document.addEventListener('DOMContentLoaded', function() {
        const content = document.getElementById('page-content');
        if (!content) return;

        content.innerHTML = `
                <div class="section-title" style="margin-top:2rem;">
                    <h2 data-i18n="docs.pageTitle">📚 项目文档</h2>
                    <a href="repositories.html"><span data-i18n="common.repository">仓库</span> <i class="fas fa-chevron-right"></i></a>
                </div>

                <div class="search-wrapper">
                    <div class="search-box">
                        <i class="fas fa-search"></i>
                        <input type="text" id="searchInput" placeholder="" data-i18n="docs.searchPlaceholder" autocomplete="off">
                    </div>
                </div>

                <div class="docs-grid" id="docsGrid">
                    <a href="carpetplus-docs.html" style="text-decoration: none;" class="doc-card-link">
                        <article class="doc-card">
                            <div class="card-icon"><i class="fas fa-cube"></i></div>
                            <h3 data-i18n="docs.carpetplus.title">CarpetPlus</h3>
                            <p data-i18n="docs.carpetplus.desc">Minecraft Carpet 扩展模组，提供更多游戏特性控制与优化。</p>
                            <div class="card-meta">
                                <span class="tag"><i class="fas fa-book"></i> <span data-i18n="common.doc">文档</span></span>
                                <span class="doc-link"><span data-i18n="common.read">阅读</span> <i class="fas fa-arrow-right"></i></span>
                            </div>
                        </article>
                    </a>
                    <a href="lwjglwindows-docs.html" style="text-decoration: none;" class="doc-card-link">
                        <article class="doc-card">
                            <div class="card-icon"><i class="fas fa-window-maximize"></i></div>
                            <h3 data-i18n="docs.lwjglwindows.title">LWJGLwindows</h3>
                            <p data-i18n="docs.lwjglwindows.desc">LWJGL 窗口封装库，旨在解决Minecraft不同版本间GUI代码差异问题。</p>
                            <div class="card-meta">
                                <span class="tag"><i class="fas fa-book"></i> <span data-i18n="common.doc">文档</span></span>
                                <span class="doc-link"><span data-i18n="common.read">阅读</span> <i class="fas fa-arrow-right"></i></span>
                            </div>
                        </article>
                    </a>
                </div>

                <div style="margin: 3rem 0; text-align: center; opacity: 0.7;">
                    <p data-i18n="docs.search.foot">选择上面的项目查看详细文档。</p>
                </div>
            `;

        window.applyLanguage(localStorage.getItem('siteLanguage') || 'zh');
    });
</script>
</body>
</html>
