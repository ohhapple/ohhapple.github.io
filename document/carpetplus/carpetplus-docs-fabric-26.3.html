  "zh": "\n            \n            <div style=\"margin: 2rem 0;\">\n                <a href=\"carpetplus-docs.html\" style=\"color:#4c6ef5; text-decoration:none;\"><i class=\"fas fa-chevron-left\"></i> <span>返回CarpetPlus文档索引</span></a>\n            </div>\n            <div class=\"hero\" style=\"max-width: 800px;\">\n                <span class=\"hero-badge\"><i class=\"fas fa-cube\"></i> CarpetPlus</span>\n                <h1>CarpetPlus fabric-26.3 文档</h1>\n                <p>Minecraft 26.3 的 CarpetPlus 扩展文档，包含规则说明与音乐播放器功能。</p>\n            </div>\n            <div class=\"list-section\" style=\"margin-top: 2rem;\"><h3>📦 快速开始</h3>\n<ul style=\"margin: 1rem 0 2rem 2rem; line-height: 1.8;\"><li>从 <a href=\"https://github.com/ohhapple/CarpetPlus/releases\" target=\"_blank\" rel=\"noopener\">GitHub Releases</a> 下载最新版本</li><li>如遇到问题，请在 GitHub 提交 <a href=\"https://github.com/ohhapple/CarpetPlus/issues\" target=\"_blank\" rel=\"noopener\">Issues</a></li><li>放入 Minecraft 的 <code>mods</code> 文件夹（需要 Fabric 加载器）</li><li>输入指令 <code>/carpet</code> 打开菜单，启用或禁用规则</li></ul>\n<h3>✨ 主要特性</h3>\n<ul style=\"margin: 1rem 0 2rem 2rem; line-height: 1.8;\"><li>支持 Minecraft 26.3</li><li>内置完整音乐播放器、搜索、推荐、歌词、队列、收藏和音乐频道</li><li>支持屏幕悬浮歌词、世界空间 3D 歌词和顶部迷你播放器</li><li>音乐频道支持多人一起听，需要开启 CarpetPlus 网络协议规则</li></ul></div>\n\n            <div class=\"list-section\" style=\"margin-top: 2rem; padding: 2rem;\">\n                <div class=\"rule-layout\">\n                    <div class=\"rule-content\">\n                        <h3 style=\"font-size: 1.8rem; margin-bottom: 1.5rem;\">📜 规则列表</h3>\n                        \n                    <div id=\"rule-SuperWindCharge\" class=\"rule-item\">\n                        <h4>风弹螺旋丸手里剑 (SuperWindCharge)</h4>\n                        <div class=\"rule-meta\"><span class=\"rule-category\">ohhapple</span><span class=\"rule-category\">FEATURE</span></div>\n                        <p>使玩家投出的风弹伤害、范围、击退属性增大。</p>\n                        <p>类型: <code>boolean</code> | 默认值: <code>false</code> | 可选参数: <code>true, false</code></p>\n                        <p>开启方法: <code>/carpet SuperWindCharge true</code></p>\n                    </div>\n                    <div id=\"rule-VillageAlwaysBreed\" class=\"rule-item\">\n                        <h4>村民一直繁殖 (VillageAlwaysBreed)</h4>\n                        <div class=\"rule-meta\"><span class=\"rule-category\">ohhapple</span><span class=\"rule-category\">FEATURE</span></div>\n                        <p>村民（包括小村民）数量大于二且周围有多余空床时，会持续进行繁殖。</p>\n                        <p>类型: <code>boolean</code> | 默认值: <code>false</code> | 可选参数: <code>true, false</code></p>\n                        <p>开启方法: <code>/carpet VillageAlwaysBreed true</code></p>\n                    </div>\n                    <div id=\"rule-SuperSponge\" class=\"rule-item\">\n                        <h4>超级海绵模式 (SuperSponge)</h4>\n                        <div class=\"rule-meta\"><span class=\"rule-category\">ohhapple</span><span class=\"rule-category\">FEATURE</span></div>\n                        <p>设置海绵可以吸收的流体类型，可配合 SuperSpongeRadius 调整生效范围。</p>\n                        <p>类型: <code>String</code> | 默认值: <code>&quot;false&quot;</code> | 可选参数: <code>&quot;false&quot;</code>, <code>&quot;water&quot;</code>, <code>&quot;lava&quot;</code>, <code>&quot;both&quot;</code></p>\n                        <p>开启方法: <code>/carpet SuperSponge both</code></p>\n                    </div>\n                    <div id=\"rule-SuperSpongeRadius\" class=\"rule-item\">\n                        <h4>超级海绵生效半径 (SuperSpongeRadius)</h4>\n                        <div class=\"rule-meta\"><span class=\"rule-category\">ohhapple</span><span class=\"rule-category\">FEATURE</span></div>\n                        <p>设置超级海绵模式下的生效半径，需要先开启 SuperSponge。</p>\n                        <p>类型: <code>int</code> | 默认值: <code>6</code> | 可选参数: <code>0, 6, 10, 20, 100</code></p>\n                        <p>开启方法: <code>/carpet SuperSpongeRadius 100</code></p>\n                    </div>\n                    <div id=\"rule-concreteBurnedIntoglass\" class=\"rule-item\">\n                        <h4>混凝土粉末烧玻璃 (concreteBurnedIntoglass)</h4>\n                        <div class=\"rule-meta\"><span class=\"rule-category\">ohhapple</span><span class=\"rule-category\">FEATURE</span></div>\n                        <p>16 色混凝土粉末可以在熔炉内烧成对应颜色的玻璃。</p>\n                        <p>类型: <code>boolean</code> | 默认值: <code>false</code> | 可选参数: <code>true, false</code></p>\n                        <p>开启方法: <code>/carpet concreteBurnedIntoglass true</code></p>\n                    </div>\n                    <div id=\"rule-StackablePotion\" class=\"rule-item\">\n                        <h4>药水可堆叠 (StackablePotion)</h4>\n                        <div class=\"rule-meta\"><span class=\"rule-category\">ohhapple</span><span class=\"rule-category\">FEATURE</span></div>\n                        <p>设置药水的最大堆叠数量。</p>\n                        <p>类型: <code>int</code> | 默认值: <code>1</code> | 可选参数: <code>1, 16, 64</code></p>\n                        <p>开启方法: <code>/carpet StackablePotion 64</code></p>\n                    </div>\n                    <div id=\"rule-StackableEnchantedBook\" class=\"rule-item\">\n                        <h4>附魔书可堆叠 (StackableEnchantedBook)</h4>\n                        <div class=\"rule-meta\"><span class=\"rule-category\">ohhapple</span><span class=\"rule-category\">FEATURE</span></div>\n                        <p>设置附魔书的最大堆叠数量。</p>\n                        <p>类型: <code>int</code> | 默认值: <code>1</code> | 可选参数: <code>1, 16, 64</code></p>\n                        <p>开启方法: <code>/carpet StackableEnchantedBook 64</code></p>\n                    </div>\n                    <div id=\"rule-StackableTotemOfUndying\" class=\"rule-item\">\n                        <h4>不死图腾可堆叠 (StackableTotemOfUndying)</h4>\n                        <div class=\"rule-meta\"><span class=\"rule-category\">ohhapple</span><span class=\"rule-category\">FEATURE</span></div>\n                        <p>设置不死图腾的最大堆叠数量。</p>\n                        <p>类型: <code>int</code> | 默认值: <code>1</code> | 可选参数: <code>1, 16, 64</code></p>\n                        <p>开启方法: <code>/carpet StackableTotemOfUndying 64</code></p>\n                    </div>\n                    <div id=\"rule-StackableMilkBucket\" class=\"rule-item\">\n                        <h4>奶桶可堆叠 (StackableMilkBucket)</h4>\n                        <div class=\"rule-meta\"><span class=\"rule-category\">ohhapple</span><span class=\"rule-category\">FEATURE</span></div>\n                        <p>设置奶桶的最大堆叠数量。</p>\n                        <p>类型: <code>int</code> | 默认值: <code>1</code> | 可选参数: <code>1, 16, 64</code></p>\n                        <p>开启方法: <code>/carpet StackableMilkBucket 64</code></p>\n                    </div>\n                    <div id=\"rule-EquipmentUnbreak\" class=\"rule-item\">\n                        <h4>装备不消耗耐久 (EquipmentUnbreak)</h4>\n                        <div class=\"rule-meta\"><span class=\"rule-category\">ohhapple</span><span class=\"rule-category\">FEATURE</span></div>\n                        <p>装备使用时不消耗耐久度。</p>\n                        <p>类型: <code>boolean</code> | 默认值: <code>false</code> | 可选参数: <code>true, false</code></p>\n                        <p>开启方法: <code>/carpet EquipmentUnbreak true</code></p>\n                    </div>\n                    <div id=\"rule-ShulkerBoxNested\" class=\"rule-item\">\n                        <h4>潜影盒嵌套 (ShulkerBoxNested)</h4>\n                        <div class=\"rule-meta\"><span class=\"rule-category\">ohhapple</span><span class=\"rule-category\">FEATURE</span></div>\n                        <p>控制潜影盒是否可由玩家、红石容器或两者放入其他潜影盒。</p>\n                        <p>类型: <code>String</code> | 默认值: <code>&quot;false&quot;</code> | 可选参数: <code>&quot;false&quot;</code>, <code>&quot;player&quot;</code>, <code>&quot;redstone&quot;</code>, <code>&quot;both&quot;</code></p>\n                        <p>开启方法: <code>/carpet ShulkerBoxNested both</code></p>\n                    </div>\n                    <div id=\"rule-CarpetPlusNetwork\" class=\"rule-item\">\n                        <h4>CarpetPlus网络协议总开关 (CarpetPlusNetwork)</h4>\n                        <div class=\"rule-meta\"><span class=\"rule-category\">ohhapple</span><span class=\"rule-category\">PLUS_NETWORK</span></div>\n                        <p>CarpetPlus 网络协议处理总开关，开启后才能使用网络同步和多人音乐频道功能。</p>\n                        <p>类型: <code>boolean</code> | 默认值: <code>true</code> | 可选参数: <code>true, false</code></p>\n                        <p>开启方法: <code>/carpet CarpetPlusNetwork true</code></p>\n                    </div>\n                    <div id=\"rule-GetPlayerFps\" class=\"rule-item\">\n                        <h4>获取服务器玩家FPS (GetPlayerFps)</h4>\n                        <div class=\"rule-meta\"><span class=\"rule-category\">ohhapple</span><span class=\"rule-category\">PLUS_NETWORK</span><span class=\"rule-category\">COMMAND</span></div>\n                        <p>获取并显示服务器玩家的实时 FPS。</p>\n                        <p>类型: <code>String</code> | 默认值: <code>&quot;false&quot;</code> | 可选参数: <code>0</code>, <code>1</code>, <code>2</code>, <code>3</code>, <code>4</code>, <code>ops</code>, <code>true</code>, <code>false</code></p>\n                        <p>开启方法: <code>/carpet GetPlayerFps true</code></p>\n                    </div>\n                    <div id=\"rule-AmethystShardMusicChannel\" class=\"rule-item\">\n                        <h4>紫水晶碎片音乐频道 (AmethystShardMusicChannel)</h4>\n                        <div class=\"rule-meta\"><span class=\"rule-category\">ohhapple</span><span class=\"rule-category\">CLIENT</span></div>\n                        <p>开启后可在聊天框输入 <code>++cp music</code>，或手持紫水晶碎片右键打开音乐播放器。</p>\n                        <p>类型: <code>boolean</code> | 默认值: <code>false</code> | 可选参数: <code>true, false</code></p>\n                        <p>开启方法: <code>/carpet AmethystShardMusicChannel true</code></p>\n                    </div>\n                    </div>\n                    <div class=\"rule-toc\">\n                        <h4>📑 目录</h4>\n                        <div class=\"toc-search\">\n                            <i class=\"fas fa-search\"></i>\n                            <input type=\"text\" id=\"tocSearch\" placeholder=\"搜索规则\" aria-label=\"搜索规则\">\n                        </div>\n                        <ul><li><a href=\"#rule-SuperWindCharge\">风弹螺旋丸手里剑<br>(SuperWindCharge)</a></li><li><a href=\"#rule-VillageAlwaysBreed\">村民一直繁殖<br>(VillageAlwaysBreed)</a></li><li><a href=\"#rule-SuperSponge\">超级海绵模式<br>(SuperSponge)</a></li><li><a href=\"#rule-SuperSpongeRadius\">超级海绵生效半径<br>(SuperSpongeRadius)</a></li><li><a href=\"#rule-concreteBurnedIntoglass\">混凝土粉末烧玻璃<br>(concreteBurnedIntoglass)</a></li><li><a href=\"#rule-StackablePotion\">药水可堆叠<br>(StackablePotion)</a></li><li><a href=\"#rule-StackableEnchantedBook\">附魔书可堆叠<br>(StackableEnchantedBook)</a></li><li><a href=\"#rule-StackableTotemOfUndying\">不死图腾可堆叠<br>(StackableTotemOfUndying)</a></li><li><a href=\"#rule-StackableMilkBucket\">奶桶可堆叠<br>(StackableMilkBucket)</a></li><li><a href=\"#rule-EquipmentUnbreak\">装备不消耗耐久<br>(EquipmentUnbreak)</a></li><li><a href=\"#rule-ShulkerBoxNested\">潜影盒嵌套<br>(ShulkerBoxNested)</a></li><li><a href=\"#rule-CarpetPlusNetwork\">CarpetPlus网络协议总开关<br>(CarpetPlusNetwork)</a></li><li><a href=\"#rule-GetPlayerFps\">获取服务器玩家FPS<br>(GetPlayerFps)</a></li><li><a href=\"#rule-AmethystShardMusicChannel\">紫水晶碎片音乐频道<br>(AmethystShardMusicChannel)</a></li></ul>\n                    </div>\n                </div>\n            </div>\n<div class=\"list-section\" style=\"margin-top: 2rem;\"><h3>🎵 音乐播放器</h3>\n<ul style=\"margin: 1rem 0 2rem 2rem; line-height: 1.8;\"><li>支持歌曲搜索、推荐、封面、歌手/专辑、时长、歌词与翻译、音量、进度拖动和播放队列</li><li>搜索结果可按歌曲、歌单、歌手和专辑分类浏览</li><li>发现页包含每日推荐、私人漫游、雷达歌单、每日 Mix、排行榜、场景电台和分类推荐</li><li>音频使用临时音源直链和有限预读，不保存歌曲到本地</li><li>支持屏幕悬浮歌词、世界空间 3D 歌词和顶部迷你播放器</li><li>支持多人音乐频道；分享歌曲只会发给同一频道成员</li><li>平台登录可选，登录后可同步账号歌单和“我喜欢的音乐”</li></ul>\n<p>多人一起听需要同时开启：</p>\n<pre style=\"background: rgba(0,0,0,0.1); padding: 1rem; border-radius: 8px; margin: 1rem 0;\"><code>/carpet CarpetPlusNetwork true\n/carpet AmethystShardMusicChannel true</code></pre>\n<h3>🔐 账号与 Cookie 安全</h3>\n<ul style=\"margin: 1rem 0 2rem 2rem; line-height: 1.8;\"><li>音乐平台登录完全可选；未登录仍可使用公开搜索、推荐和可播放内容。</li><li>Cookie、<code>MUSIC_U</code>、二维码登录 key、账号资料和加密登录文件都只应保留在客户端本机，禁止发送给其他玩家、上传到服务器或提交到 Issue。</li><li>不要公开分享包含 Cookie、二维码 key、账号昵称或服务器地址的截图和日志。发送排障日志前请先删除相关隐私信息。</li><li>收藏、歌单和账号凭据使用本机随机密钥通过 AES-GCM 加密保存，但加密不能替代妥善保管文件。不要将从他人处获得的 <code>data-key</code> 和加密数据直接放入自己的客户端。</li></ul>\n<h3>⚠️ 免责声明</h3>\n<p>CarpetPlus 是非官方项目，与 Mojang Studios、Microsoft、音乐平台及其关联方不存在隶属、授权或合作关系，相关名称仅用于说明兼容范围和服务来源。</p>\n<p>CarpetPlus 不绕过音乐平台的登录、会员、付费、版权或地区限制。歌曲能否播放取决于平台接口、版权状态和当前账号权益，项目不保证任何歌曲、歌单、歌词或接口持续可用。</p>\n<p>使用本模组即表示你理解并自行承担相关风险。建议在使用前备份世界与配置，并遵守所在服务器的规则及音乐平台的服务条款。项目按许可证现状提供，不对数据丢失、账号风险、服务中断或接口变化作额外担保。</p>\n<p>更多信息请查看 <a href=\"https://github.com/ohhapple/CarpetPlus\" target=\"_blank\" rel=\"noopener\">CarpetPlus GitHub 仓库</a>。</p></div>",
  "en": "\n            \n            <div style=\"margin: 2rem 0;\">\n                <a href=\"carpetplus-docs.html\" style=\"color:#4c6ef5; text-decoration:none;\"><i class=\"fas fa-chevron-left\"></i> <span>Back to CarpetPlus Docs Index</span></a>\n            </div>\n            <div class=\"hero\" style=\"max-width: 800px;\">\n                <span class=\"hero-badge\"><i class=\"fas fa-cube\"></i> CarpetPlus</span>\n                <h1>CarpetPlus fabric-26.3 Documentation</h1>\n                <p>CarpetPlus documentation for Minecraft 26.3, including rules and the music player.</p>\n            </div>\n            <div class=\"list-section\" style=\"margin-top: 2rem;\"><h3>📦 Quick Start</h3>\n<ul style=\"margin: 1rem 0 2rem 2rem; line-height: 1.8;\"><li>Download the latest version from <a href=\"https://github.com/ohhapple/CarpetPlus/releases\" target=\"_blank\" rel=\"noopener\">GitHub Releases</a></li><li>If you encounter problems, submit <a href=\"https://github.com/ohhapple/CarpetPlus/issues\" target=\"_blank\" rel=\"noopener\">GitHub Issues</a></li><li>Place it in Minecraft&#39;s <code>mods</code> folder (requires Fabric Loader)</li><li>Use <code>/carpet</code> to open the menu and enable or disable rules</li></ul>\n<h3>✨ Key Features</h3>\n<ul style=\"margin: 1rem 0 2rem 2rem; line-height: 1.8;\"><li>Minecraft 26.3 support</li><li>A complete in-game music player with search, recommendations, lyrics, queues, favorites, and channels</li><li>Screen-space lyrics, world-space 3D lyrics, and a compact HUD player</li><li>Multiplayer listening through music channels when CarpetPlus networking is enabled</li></ul></div>\n\n            <div class=\"list-section\" style=\"margin-top: 2rem; padding: 2rem;\">\n                <div class=\"rule-layout\">\n                    <div class=\"rule-content\">\n                        <h3 style=\"font-size: 1.8rem; margin-bottom: 1.5rem;\">📜 Rule List</h3>\n                        \n                    <div id=\"rule-SuperWindCharge\" class=\"rule-item\">\n                        <h4>SuperWindCharge</h4>\n                        <div class=\"rule-meta\"><span class=\"rule-category\">ohhapple</span><span class=\"rule-category\">FEATURE</span></div>\n                        <p>Increases the damage, range, and knockback of wind charges thrown by players.</p>\n                        <p>Type: <code>boolean</code> | Default: <code>false</code> | Options: <code>true, false</code></p>\n                        <p>Enable command: <code>/carpet SuperWindCharge true</code></p>\n                    </div>\n                    <div id=\"rule-VillageAlwaysBreed\" class=\"rule-item\">\n                        <h4>VillageAlwaysBreed</h4>\n                        <div class=\"rule-meta\"><span class=\"rule-category\">ohhapple</span><span class=\"rule-category\">FEATURE</span></div>\n                        <p>Villagers, including baby villagers, continue breeding when there are more than two villagers and spare beds are available.</p>\n                        <p>Type: <code>boolean</code> | Default: <code>false</code> | Options: <code>true, false</code></p>\n                        <p>Enable command: <code>/carpet VillageAlwaysBreed true</code></p>\n                    </div>\n                    <div id=\"rule-SuperSponge\" class=\"rule-item\">\n                        <h4>SuperSponge</h4>\n                        <div class=\"rule-meta\"><span class=\"rule-category\">ohhapple</span><span class=\"rule-category\">FEATURE</span></div>\n                        <p>Select which fluids the sponge can absorb. Use SuperSpongeRadius to adjust the effective range.</p>\n                        <p>Type: <code>String</code> | Default: <code>&quot;false&quot;</code> | Options: <code>&quot;false&quot;</code>, <code>&quot;water&quot;</code>, <code>&quot;lava&quot;</code>, <code>&quot;both&quot;</code></p>\n                        <p>Enable command: <code>/carpet SuperSponge both</code></p>\n                    </div>\n                    <div id=\"rule-SuperSpongeRadius\" class=\"rule-item\">\n                        <h4>SuperSpongeRadius</h4>\n                        <div class=\"rule-meta\"><span class=\"rule-category\">ohhapple</span><span class=\"rule-category\">FEATURE</span></div>\n                        <p>Sets the effective radius for SuperSponge mode. SuperSponge must be enabled first.</p>\n                        <p>Type: <code>int</code> | Default: <code>6</code> | Options: <code>0, 6, 10, 20, 100</code></p>\n                        <p>Enable command: <code>/carpet SuperSpongeRadius 100</code></p>\n                    </div>\n                    <div id=\"rule-concreteBurnedIntoglass\" class=\"rule-item\">\n                        <h4>concreteBurnedIntoglass</h4>\n                        <div class=\"rule-meta\"><span class=\"rule-category\">ohhapple</span><span class=\"rule-category\">FEATURE</span></div>\n                        <p>Allows all 16 concrete powder colors to be smelted into matching stained glass.</p>\n                        <p>Type: <code>boolean</code> | Default: <code>false</code> | Options: <code>true, false</code></p>\n                        <p>Enable command: <code>/carpet concreteBurnedIntoglass true</code></p>\n                    </div>\n                    <div id=\"rule-StackablePotion\" class=\"rule-item\">\n                        <h4>StackablePotion</h4>\n                        <div class=\"rule-meta\"><span class=\"rule-category\">ohhapple</span><span class=\"rule-category\">FEATURE</span></div>\n                        <p>Sets the maximum stack size for potions.</p>\n                        <p>Type: <code>int</code> | Default: <code>1</code> | Options: <code>1, 16, 64</code></p>\n                        <p>Enable command: <code>/carpet StackablePotion 64</code></p>\n                    </div>\n                    <div id=\"rule-StackableEnchantedBook\" class=\"rule-item\">\n                        <h4>StackableEnchantedBook</h4>\n                        <div class=\"rule-meta\"><span class=\"rule-category\">ohhapple</span><span class=\"rule-category\">FEATURE</span></div>\n                        <p>Sets the maximum stack size for enchanted books.</p>\n                        <p>Type: <code>int</code> | Default: <code>1</code> | Options: <code>1, 16, 64</code></p>\n                        <p>Enable command: <code>/carpet StackableEnchantedBook 64</code></p>\n                    </div>\n                    <div id=\"rule-StackableTotemOfUndying\" class=\"rule-item\">\n                        <h4>StackableTotemOfUndying</h4>\n                        <div class=\"rule-meta\"><span class=\"rule-category\">ohhapple</span><span class=\"rule-category\">FEATURE</span></div>\n                        <p>Sets the maximum stack size for Totems of Undying.</p>\n                        <p>Type: <code>int</code> | Default: <code>1</code> | Options: <code>1, 16, 64</code></p>\n                        <p>Enable command: <code>/carpet StackableTotemOfUndying 64</code></p>\n                    </div>\n                    <div id=\"rule-StackableMilkBucket\" class=\"rule-item\">\n                        <h4>StackableMilkBucket</h4>\n                        <div class=\"rule-meta\"><span class=\"rule-category\">ohhapple</span><span class=\"rule-category\">FEATURE</span></div>\n                        <p>Sets the maximum stack size for milk buckets.</p>\n                        <p>Type: <code>int</code> | Default: <code>1</code> | Options: <code>1, 16, 64</code></p>\n                        <p>Enable command: <code>/carpet StackableMilkBucket 64</code></p>\n                    </div>\n                    <div id=\"rule-EquipmentUnbreak\" class=\"rule-item\">\n                        <h4>EquipmentUnbreak</h4>\n                        <div class=\"rule-meta\"><span class=\"rule-category\">ohhapple</span><span class=\"rule-category\">FEATURE</span></div>\n                        <p>Equipment no longer consumes durability.</p>\n                        <p>Type: <code>boolean</code> | Default: <code>false</code> | Options: <code>true, false</code></p>\n                        <p>Enable command: <code>/carpet EquipmentUnbreak true</code></p>\n                    </div>\n                    <div id=\"rule-ShulkerBoxNested\" class=\"rule-item\">\n                        <h4>ShulkerBoxNested</h4>\n                        <div class=\"rule-meta\"><span class=\"rule-category\">ohhapple</span><span class=\"rule-category\">FEATURE</span></div>\n                        <p>Controls whether shulker boxes can be placed inside other shulker boxes by players, redstone containers, or both.</p>\n                        <p>Type: <code>String</code> | Default: <code>&quot;false&quot;</code> | Options: <code>&quot;false&quot;</code>, <code>&quot;player&quot;</code>, <code>&quot;redstone&quot;</code>, <code>&quot;both&quot;</code></p>\n                        <p>Enable command: <code>/carpet ShulkerBoxNested both</code></p>\n                    </div>\n                    <div id=\"rule-CarpetPlusNetwork\" class=\"rule-item\">\n                        <h4>CarpetPlusNetwork</h4>\n                        <div class=\"rule-meta\"><span class=\"rule-category\">ohhapple</span><span class=\"rule-category\">PLUS_NETWORK</span></div>\n                        <p>Master switch for CarpetPlus networking. Multiplayer music channels and network synchronization require it to be enabled.</p>\n                        <p>Type: <code>boolean</code> | Default: <code>true</code> | Options: <code>true, false</code></p>\n                        <p>Enable command: <code>/carpet CarpetPlusNetwork true</code></p>\n                    </div>\n                    <div id=\"rule-GetPlayerFps\" class=\"rule-item\">\n                        <h4>GetPlayerFps</h4>\n                        <div class=\"rule-meta\"><span class=\"rule-category\">ohhapple</span><span class=\"rule-category\">PLUS_NETWORK</span><span class=\"rule-category\">COMMAND</span></div>\n                        <p>Retrieves and displays the real-time FPS of server players.</p>\n                        <p>Type: <code>String</code> | Default: <code>&quot;false&quot;</code> | Options: <code>0</code>, <code>1</code>, <code>2</code>, <code>3</code>, <code>4</code>, <code>ops</code>, <code>true</code>, <code>false</code></p>\n                        <p>Enable command: <code>/carpet GetPlayerFps true</code></p>\n                    </div>\n                    <div id=\"rule-AmethystShardMusicChannel\" class=\"rule-item\">\n                        <h4>AmethystShardMusicChannel</h4>\n                        <div class=\"rule-meta\"><span class=\"rule-category\">ohhapple</span><span class=\"rule-category\">CLIENT</span></div>\n                        <p>Allows <code>++cp music</code> in chat or right-clicking an amethyst shard to open the music player.</p>\n                        <p>Type: <code>boolean</code> | Default: <code>false</code> | Options: <code>true, false</code></p>\n                        <p>Enable command: <code>/carpet AmethystShardMusicChannel true</code></p>\n                    </div>\n                    </div>\n                    <div class=\"rule-toc\">\n                        <h4>📑 Table of Contents</h4>\n                        <div class=\"toc-search\">\n                            <i class=\"fas fa-search\"></i>\n                            <input type=\"text\" id=\"tocSearch\" placeholder=\"Search rules\" aria-label=\"Search rules\">\n                        </div>\n                        <ul><li><a href=\"#rule-SuperWindCharge\">SuperWindCharge</a></li><li><a href=\"#rule-VillageAlwaysBreed\">VillageAlwaysBreed</a></li><li><a href=\"#rule-SuperSponge\">SuperSponge</a></li><li><a href=\"#rule-SuperSpongeRadius\">SuperSpongeRadius</a></li><li><a href=\"#rule-concreteBurnedIntoglass\">concreteBurnedIntoglass</a></li><li><a href=\"#rule-StackablePotion\">StackablePotion</a></li><li><a href=\"#rule-StackableEnchantedBook\">StackableEnchantedBook</a></li><li><a href=\"#rule-StackableTotemOfUndying\">StackableTotemOfUndying</a></li><li><a href=\"#rule-StackableMilkBucket\">StackableMilkBucket</a></li><li><a href=\"#rule-EquipmentUnbreak\">EquipmentUnbreak</a></li><li><a href=\"#rule-ShulkerBoxNested\">ShulkerBoxNested</a></li><li><a href=\"#rule-CarpetPlusNetwork\">CarpetPlusNetwork</a></li><li><a href=\"#rule-GetPlayerFps\">GetPlayerFps</a></li><li><a href=\"#rule-AmethystShardMusicChannel\">AmethystShardMusicChannel</a></li></ul>\n                    </div>\n                </div>\n            </div>\n<div class=\"list-section\" style=\"margin-top: 2rem;\"><h3>🎵 Music Player</h3>\n<ul style=\"margin: 1rem 0 2rem 2rem; line-height: 1.8;\"><li>Search, recommendations, cover art, artist and album information, duration, lyrics and translations, volume, seeking, and a playback queue</li><li>Search results categorized by songs, playlists, artists, and albums</li><li>Discovery includes daily recommendations, private roaming, radar playlists, daily mixes, charts, scene radio, and categorized playlists</li><li>Audio uses temporary stream URLs and bounded prefetching; songs are not saved locally</li><li>Screen lyrics, world-space 3D lyrics, and a compact top HUD player</li><li>Music channels for shared listening; tracks are shared only within the same channel</li><li>Optional platform login with account playlist and favorite-song synchronization</li></ul>\n<p>Enable both rules for multiplayer listening:</p>\n<pre style=\"background: rgba(0,0,0,0.1); padding: 1rem; border-radius: 8px; margin: 1rem 0;\"><code>/carpet CarpetPlusNetwork true\n/carpet AmethystShardMusicChannel true</code></pre>\n<h3>🔐 Account and Cookie Security</h3>\n<ul style=\"margin: 1rem 0 2rem 2rem; line-height: 1.8;\"><li>Music platform login is completely optional. Public search, recommendations, and playable content remain available while logged out.</li><li>Cookies, <code>MUSIC_U</code>, QR login keys, account information, and encrypted login files must remain local to the client. Never send them to other players, upload them to a server, or include them in an issue.</li><li>Do not publicly share screenshots or logs containing cookies, QR keys, account names, or server addresses. Remove private information before sharing a troubleshooting log.</li><li>Favorites, playlists, and account credentials are encrypted locally with a random installation key using AES-GCM, but encryption does not replace securely storing the files. Do not insert a <code>data-key</code> or encrypted data received from someone else into your client.</li></ul>\n<h3>⚠️ Disclaimer</h3>\n<p>CarpetPlus is an unofficial project. It is not affiliated with, authorized by, or partnered with Mojang Studios, Microsoft, music platforms, or their affiliates. Related names are used only to describe compatibility and service sources.</p>\n<p>CarpetPlus does not bypass music platform login, membership, payment, copyright, or regional restrictions. Playback depends on platform APIs, copyright status, and the current account&#39;s entitlements. The project does not guarantee that any song, playlist, lyric, or API will remain available.</p>\n<p>By using this mod, you understand and accept the related risks. Back up worlds and configuration before use, and follow the rules of your server and the terms of service of the music platform. The project is provided as-is under its license and makes no additional guarantees regarding data loss, account risk, service interruption, or API changes.</p>\n<p>For more information, see the <a href=\"https://github.com/ohhapple/CarpetPlus\" target=\"_blank\" rel=\"noopener\">CarpetPlus GitHub repository</a>.</p></div>"
};
    const documentTitles = {
  "zh": "CarpetPlus fabric-26.3 文档",
  "en": "CarpetPlus fabric-26.3 Documentation"
};
    const documentDescriptions = {
  "zh": "Minecraft 26.3 的 CarpetPlus 扩展文档，包含规则说明与音乐播放器功能。",
  "en": "CarpetPlus documentation for Minecraft 26.3, including rules and the music player."
};

    function getDocumentLanguage() {
        const stored = localStorage.getItem('siteLanguage') || 'zh';
        return documentContent[stored] ? stored : 'en';
    }

    function renderStaticDocument() {
        const content = document.getElementById('page-content');
        if (!content) return;

        const language = getDocumentLanguage();
        content.innerHTML = '<article class="legacy-static-doc">' + documentContent[language] + '</article>';
        document.title = documentTitles[language];
        document.documentElement.lang = language === 'zh' ? 'zh-CN' : 'en';
        const description = document.querySelector('meta[name="description"]');
        if (description) description.content = documentDescriptions[language];

        if (typeof window.initCarpetPlusFeatures === 'function') {
            window.initCarpetPlusFeatures();
        }
    }

    renderStaticDocument();
    document.addEventListener('languageChanged', renderStaticDocument);
</script>
