<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CarpetPlus · 版本列表</title>
    <link rel="icon" type="image/x-icon" href="../../images/icon/ohhapple.ico">
    <link rel="manifest" href="../../images/icon/site.webmanifest">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="../../css/style.css">
</head>
<body>
<script src="../../js/script.js"></script>
<script>
    renderCommonLayout('docs', '../../');   // 可沿用 'docs' 标识，导航高亮仍为文档页

    const pageI18n = {
        zh: {
            'versionlist.back': '返回文档索引',
            'versionlist.title1.carpet': 'CarpetPlus 版本列表',
            'versionlist.title.carpet': 'CarpetPlus 所有版本',
            'versionlist.desc': '选择对应版本查看详细文档和更新说明。',
            'versionlist.searchPlaceholder': '搜索版本号...',
            'versionlist.count': '共',
            'versionlist.versions': '个版本',
            'versionlist.desc1.carpet': '发布日期：2026-01-19<br>首个公开发布版本',
            'common.doc': '文档',
            'common.view': '查看'
        },
        en: {
            'versionlist.back': 'Back to Docs Index',
            'versionlist.title1.carpet': 'CarpetPlus Version List',
            'versionlist.title.carpet': 'All CarpetPlus Versions',
            'versionlist.desc': 'Select a version to view detailed documentation and release notes.',
            'versionlist.searchPlaceholder': 'Search version...',
            'versionlist.count': 'Total',
            'versionlist.versions': 'versions',
            'versionlist.desc1.carpet': 'Release Date: 2026-01-19<br>First publicly released version',
            'common.doc': 'Docs',
            'common.view': 'View'
        }
    };

    Object.assign(window.i18n.zh, pageI18n.zh);
    Object.assign(window.i18n.en, pageI18n.en);

    document.addEventListener('DOMContentLoaded', function() {
        const content = document.getElementById('page-content');
        if (!content) return;

        content.innerHTML = `
                <div style="margin: 2rem 0;">
                    <a href="../document.html" style="color:#4c6ef5; text-decoration:none;"><i class="fas fa-chevron-left"></i> <span data-i18n="versionlist.back">返回文档索引</span></a>
                </div>
                <div class="hero" style="max-width: 800px;">
                    <span class="hero-badge"><i class="fas fa-cube"></i><span data-i18n="versionlist.title1.carpet">CarpetPlus 版本列表</span></span>
                    <h1 data-i18n="versionlist.title.carpet">CarpetPlus 所有版本</h1>
                    <p data-i18n="versionlist.desc">选择对应版本查看详细文档和更新说明。</p>
                </div>

                <div class="search-wrapper">
                    <div class="search-box">
                        <i class="fas fa-search"></i>
                        <input type="text" id="searchInput" placeholder="" data-i18n="versionlist.searchPlaceholder" autocomplete="off">
                    </div>
                </div>

                <div class="docs-grid" id="docsGrid">
                    <a href="carpetplus-docs-fabric-1.21.10.html" style="text-decoration: none;" class="doc-card-link">
                        <article class="doc-card">
                            <div class="card-icon"><i class="fas fa-tag"></i></div>
                            <h3>fabric-1.21.10</h3>
                            <p data-i18n="versionlist.desc1.carpet">发布日期：2026-01-19<br>首个公开发布版本</p>
                            <div class="card-meta">
                                <span class="tag"><i class="fas fa-book"></i> <span data-i18n="common.doc">文档</span></span>
                                <span class="doc-link"><span data-i18n="common.view">查看</span> <i class="fas fa-arrow-right"></i></span>
                            </div>
                        </article>
                    </a>
                </div>

                <div style="margin: 3rem 0; text-align: center; opacity: 0.7;">
                    <p><span data-i18n="versionlist.count">共</span> <span id="versionCount">1</span> <span data-i18n="versionlist.versions">个版本</span></p>
                </div>
            `;

        window.applyLanguage(localStorage.getItem('siteLanguage') || 'zh');
        window.updateVersionCount();
    });
</script>
</body>
</html>
