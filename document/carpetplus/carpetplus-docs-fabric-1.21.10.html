                    <h3 data-i18n="carpetplus.commandsDesc">关于玩家独立视距范围的指令：</h3>
                    <ul style="margin: 1rem 0 2rem 2rem; line-height: 1.8;">
                        <li data-i18n="carpetplus.commands.item1">启用功能：<code>/carpet playerSpecificChunks true</code></li>
                        <li data-i18n="carpetplus.commands.item2">开启功能后玩家默认视距被设置为10（不会超过服务器视距）</li>
                        <li data-i18n="carpetplus.commands.item3">设置玩家视距：<code>/playerchunk set</code></li>
                        <li data-i18n="carpetplus.commands.item4">查看玩家视距：<code>/playerchunk get</code></li>
                        <li data-i18n="carpetplus.commands.item5">列出所有设置：<code>/playerchunk list</code></li>
                        <li data-i18n="carpetplus.commands.item6">查看状态：<code>/playerchunk status</code></li>
                        <li data-i18n="carpetplus.commands.item7">统计信息：<code>/chunkstats</code></li>
                    </ul>

                    <h3 data-i18n="carpetplus.exampleTitle">📝 示例代码</h3>
                    <pre style="background: rgba(0,0,0,0.1); padding: 1rem; border-radius: 8px; margin: 1rem 0;">
    启用功能
    /carpet playerSpecificChunks true
    开启功能后玩家默认视距被设置为10（不会超过服务器视距）
    设置单个玩家
    /playerchunk set 玩家A 10
    设置多个玩家
    /playerchunk set @a 10          # 所有玩家
    /playerchunk set @r 8           # 随机玩家
    /playerchunk set @p 12          # 最近的玩家
    查看设置
    /playerchunk get 玩家A
    /playerchunk get @s             # 自己
    列出所有设置
    /playerchunk list
    查看状态
    /playerchunk status
    统计信息
    /chunkstats
                    </pre>
