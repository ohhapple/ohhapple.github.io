    <link rel="icon" type="image/x-icon" href="../images/icon/ohhapple.ico">

</head>
<body>
<script src="../js/script.js"></script>
<script>
    renderCommonLayout('about', '../');

    const pageI18n = {
        zh: {

            'about.noteTitle': '📌 说明',
            'about.noteContent': '- 本栏用于说明个人文档导航的用途：收纳笔记、资料、文档等内容，提供便捷的文档查阅和管理。<br>- 用途：个人文档集中管理，汇总笔记、资料与文档，方便日常检索、整理和存放。',

            'about.contactItem': 'GitHub: @ohhapple',
            'about.footer': '欢迎在 GitHub 上 star 或提出建议。'

            'about.desc': '- Introduction: This page clarifies the purpose of the docs — centralized storage for notes, materials, etc., for easy reference.',

            'about.contactTitle': '🔗 Contact',
            'about.contactItem': 'GitHub: @ohhapple',
            'about.footer': 'Welcome to star or suggest on GitHub.'
        }
    };

    Object.assign(window.i18n.zh, pageI18n.zh);
    Object.assign(window.i18n.en, pageI18n.en);

    document.addEventListener('DOMContentLoaded', function() {

        if (!content) return;

        content.innerHTML = `
                <div class="hero" style="max-width: 800px;">
                    <span class="hero-badge"><i class="fas fa-users"></i> <span data-i18n="about.title">关于本站</span></span>
                    <h1>ohhapple•docs</h1>
                    <p data-i18n="about.desc">- 简介：《关于》栏用于明确文档用途——集中收纳、便捷查阅笔记、资料等，供大家按需查阅。</p>

                <div class="list-section" style="margin-top: 2rem;">
                    <h3 data-i18n="about.noteTitle">📌 说明</h3>
                    <p style="margin: 1rem 0 2rem; line-height: 1.8;" data-i18n="about.noteContent">
